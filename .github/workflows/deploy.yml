name: Build and Deploy to Kubernetes

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener el hash del commit
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Instalar dependencias y correr tests
        run: |
          pip install -r requirements.txt
          pytest
        
      - name: Build de la imagen Docker
        run: docker build -t fastapi-app:${{ env.IMAGE_TAG }} .

      - name: Terraform init y apply (asegura que el ECR existe)
        working-directory: ./terraform
        run: |
          terraform init -backend-config=/home/natalia/terraform-secrets/backend.hcl -reconfigure
          terraform apply -auto-approve -var-file=/home/natalia/terraform-secrets/terraform.tfvars

      - name: Tag y push al ECR emulado
        run: |
          docker tag fastapi-app:${{ env.IMAGE_TAG }} 000000000000.dkr.ecr.us-east-1.localhost:5100/fastapi-app:${{ env.IMAGE_TAG }}
          docker push 000000000000.dkr.ecr.us-east-1.localhost:5100/fastapi-app:${{ env.IMAGE_TAG }}

      - name: Actualizar el tag de la imagen en el YAML
        run: |
          sed -i "s|fastapi-app:.*|fastapi-app:${{ env.IMAGE_TAG }}|" k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Aplicar el Deployment actualizado
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/fastapi-deployment

      - name: Commit del YAML actualizado de vuelta al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Actualizar imagen a ${{ env.IMAGE_TAG }} [skip ci]" || echo "Sin cambios que commitear"
          git push